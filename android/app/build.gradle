tasks.register('verifySeanReleaseGateDefinitions') {
    group = 'verification'
    description = 'Checks that every daily-driver release marker is declared by its authoritative source.'
    doLast {
        seanReleaseMarkerSources.each { requirement ->
            if (!requirement.source.isFile()) {
                throw new GradleException("SEAN_RELEASE_GATE_SOURCE_MISSING: ${requirement.source}")
            }
            if (!requirement.source.getText('UTF-8').contains(requirement.marker)) {
                throw new GradleException(
                    "SEAN_RELEASE_GATE_SOURCE_MARKER_MISSING: ${requirement.marker} in ${requirement.source}"
                )
            }
        }
        if (seanVersionCodeBase + seanRequiredCandidateFlutterBuildNumber != seanRequiredCandidateVersionCode) {
            throw new GradleException('SEAN_RELEASE_VERSION_CODE_MAPPING_INVALID')
        }
        logger.lifecycle(
            "SEAN_RELEASE_GATE_DEFINITIONS_PASS: buildNumber=${seanRequiredCandidateFlutterBuildNumber}, " +
                "versionCode=${seanRequiredCandidateVersionCode}"
        )
    }
}

tasks.register('verifySeanReleaseGateRegression') {
    group = 'verification'
    description = 'Proves each daily-driver AOT/native marker and immutable version requirement fails closed.'
    doLast {
        def proveMarkerRequirements = { Map<String, String> requirements, String label ->
            String completePayload = requirements.values().join('\n')
            verifySeanRequiredMarkers(completePayload, requirements, "${label}-complete")
            requirements.each { omittedFailureCode, ignoredMarker ->
                String incompletePayload = requirements.findAll { failureCode, marker ->
                    failureCode != omittedFailureCode
                }.values().join('\n')
                boolean rejected = false
                try {
                    verifySeanRequiredMarkers(incompletePayload, requirements, "${label}-negative")
                } catch (GradleException error) {
                    rejected = error.message?.startsWith("${omittedFailureCode}:")
                    if (!rejected) {
                        throw error
                    }
                }
                if (!rejected) {
                    throw new GradleException("SEAN_RELEASE_GATE_NEGATIVE_CONTROL_NOT_REJECTED: ${omittedFailureCode}")
                }
            }
        }

        proveMarkerRequirements(seanRequiredDailyDriverAotMarkers, 'aot')
        proveMarkerRequirements(seanRequiredNativePolicyMarkers, 'native')
        verifySeanCandidateVersionCode(seanRequiredCandidateVersionCode)
        [20002101, 20002102, 20002103, 20002105].each { invalidVersionCode ->
            boolean rejected = false
            try {
                verifySeanCandidateVersionCode(invalidVersionCode)
            } catch (GradleException error) {
                rejected = error.message?.startsWith('SEAN_RELEASE_VERSION_CODE_MISMATCH:')
                if (!rejected) {
                    throw error
                }
            }
            if (!rejected) {
                throw new GradleException(
                    "SEAN_RELEASE_VERSION_NEGATIVE_CONTROL_NOT_REJECTED: ${invalidVersionCode}"
                )
            }
        }
        logger.lifecycle('SEAN_RELEASE_GATE_NEGATIVE_CONTROLS_PASS')
    }
}

def verifySeanCandidateVersionInput = tasks.register('verifySeanCandidateVersionInput') {
    group = 'verification'
    description = 'Rejects a Sean candidate unless Flutter supplied build-number 104 (versionCode 20002104).'
    doLast {
        int configuredVersionCode = seanVersionCodeBase + flutterVersionCode.toInteger()
        try {
            verifySeanCandidateVersionCode(configuredVersionCode)
        } catch (GradleException error) {
            throw new GradleException(
                "SEAN_RELEASE_VERSION_CODE_MISMATCH: expected=${seanRequiredCandidateVersionCode}, " +
                    "actual=${configuredVersionCode}; invoke Flutter with --build-number=${seanRequiredCandidateFlutterBuildNumber}"
            )
        }
    }
}

def verifySeanProdReleaseAot = tasks.register('verifySeanProdReleaseAot') {
    group = 'verification'
    description = 'Rejects a Sean prod APK with stale AOT, missing native policies, or the wrong immutable version.'
    doLast {
        def apk = file("${buildDir}/outputs/apk/prod/release/app-prod-release.apk")
        verifySeanLogicalRouteAot(apk)
        verifySeanNativePolicyContracts(apk)
        verifySeanCandidateVersionMetadata(file("${buildDir}/outputs/apk/prod/release/output-metadata.json"))
        logger.lifecycle('SEAN_RELEASE_DAILY_DRIVER_AOT_NATIVE_VERSION_GATES_PASS')
    }
}

tasks.register('verifySeanPreNMemberAotRegression') {
    group = 'verification'
    description = 'Proves that the retained Build 93 pair-certificate AOT payload is rejected.'
    doLast {
        def regressionPath = providers.gradleProperty('seanPreNMemberRegressionApk').orNull
        if (!regressionPath) {
            throw new GradleException('SEAN_PRE_N_MEMBER_REGRESSION_APK_PROPERTY_REQUIRED')
        }
        try {
            verifySeanLogicalRouteAot(file(regressionPath))
        } catch (GradleException error) {
            if (error.message?.startsWith('SEAN_RELEASE_AOT_STALE_READ_CERTIFICATE_PAIR:')) {
                logger.lifecycle('BUILD_93_PAIR_CERTIFICATE_AOT_REGRESSION_PASS')
                return
            }
            throw error
        }
        throw new GradleException('BUILD_93_PAIR_CERTIFICATE_AOT_REGRESSION_NOT_REPRODUCED')
    }
}

tasks.matching { task -> task.name == 'assembleProdRelease' }.configureEach {
    dependsOn(verifySeanCandidateVersionInput)
    finalizedBy(verifySeanProdReleaseAot)
}

tasks.register('verifySeanStaleAotRegression') {
    group = 'verification'
    description = 'Proves that the retained Build 92 stale AOT payload is rejected.'
    doLast {
        def regressionPath = providers.gradleProperty('seanStaleAotRegressionApk').orNull
        if (!regressionPath) {
            throw new GradleException('SEAN_STALE_AOT_REGRESSION_APK_PROPERTY_REQUIRED')
        }
        try {
            verifySeanLogicalRouteAot(file(regressionPath))
        } catch (GradleException error) {
            if (error.message?.startsWith('SEAN_RELEASE_AOT_STALE_ROUTE_SCHEMA_V1:')) {
                logger.lifecycle('BUILD_92_STALE_AOT_REGRESSION_PASS')
                return
            }
            throw error
        }
        throw new GradleException('BUILD_92_STALE_AOT_REGRESSION_NOT_REPRODUCED')
    }
}
