plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def seanKeystoreProperties = new Properties()
def seanKeystorePropertiesPath = System.getenv('BLUEBUBBLES_SEAN_KEY_PROPERTIES')
def seanKeystorePropertiesFile = seanKeystorePropertiesPath ? rootProject.file(seanKeystorePropertiesPath) : null
if (seanKeystorePropertiesFile?.exists()) {
    seanKeystoreProperties.load(new FileInputStream(seanKeystorePropertiesFile))
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.mackeige.bluebubbles"
    compileSdk 36
    ndkVersion = "28.2.13676358"

    lintOptions {
        checkReleaseBuilds false
        disable 'InvalidPackage'
    }

    aaptOptions {
        noCompress "tflite"
    }

    defaultConfig {
        applicationId "com.mackeige.bluebubbles"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 20002000 + flutterVersionCode.toInteger()
        versionName flutterVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    // Fix for META-INF/versions/9/OSGI-INF/MANIFEST.MF duplicate file error
    // This is a known issue with the latest version of OkHttp.
    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
        seanRelease {
            keyAlias seanKeystoreProperties['keyAlias']
            keyPassword seanKeystoreProperties['keyPassword']
            storeFile seanKeystoreProperties['storeFile'] ? file(seanKeystoreProperties['storeFile']) : null
            storePassword seanKeystoreProperties['storePassword']
        }
        debug {

        }
    }

    flavorDimensions = ["app"]

    productFlavors {
        joel {
            dimension "app"
            resValue "string", "app_name_en", "BlueBubbles Dev (Joel)"
            resValue "color", "ic_launcher_background", "#4c49de"
            resValue "string", "file_provider", "com.bluebubbles.messaging.joel.fileprovider"
            applicationId "com.bluebubbles.messaging.joel"
        }
        tanay {
            dimension "app"
            resValue "string", "app_name_en", "BlueBubbles (Tanay Special Sauce)"
            resValue "color", "ic_launcher_background", "#4c49de"
            resValue "string", "file_provider", "com.bluebubbles.messaging.tanay.fileprovider"
            applicationId "com.bluebubbles.messaging.tanay"
        }
        alpha {
            dimension "app"
            resValue "string", "app_name_en", "BlueBubbles (Alpha)"
            resValue "color", "ic_launcher_background", "#49dbde"
            resValue "string", "file_provider", "com.bluebubbles.messaging.alpha.fileprovider"
            applicationId "com.bluebubbles.messaging.alpha"
        }
        beta {
            dimension "app"
            resValue "string", "app_name_en", "BlueBubbles (Beta)"
            resValue "color", "ic_launcher_background", "#4990de"
            resValue "string", "file_provider", "com.bluebubbles.messaging.beta.fileprovider"
            applicationId "com.bluebubbles.messaging.beta"
        }
        prod {
            getIsDefault().set(true)
            dimension "app"
            resValue "string", "app_name_en", "BlueBubbles Sean"
            resValue "color", "ic_launcher_background", "#4990de"
            resValue "string", "file_provider", "com.mackeige.bluebubbles.fileprovider"
            applicationId "com.mackeige.bluebubbles"
        }
    }

    buildTypes {
        release {
            productFlavors.joel.signingConfig signingConfigs.debug
            productFlavors.tanay.signingConfig signingConfigs.debug
            productFlavors.alpha.signingConfig signingConfigs.release
            productFlavors.beta.signingConfig signingConfigs.release
            productFlavors.prod.signingConfig signingConfigs.seanRelease
            minifyEnabled false
            shrinkResources false
        }
    }
    sourceSets {
        main {
            java {
                srcDirs 'src/main/java', 'src/main/java/workers'
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Android native functions
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.sharetarget:sharetarget:1.2.0"
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation "androidx.work:work-runtime:2.9.0"
    implementation "androidx.concurrent:concurrent-futures-ktx:1.2.0"

    // Firebase items
    implementation 'com.google.firebase:firebase-messaging:24.0.0'
    implementation 'com.google.firebase:firebase-database:21.0.0'
    implementation 'com.google.firebase:firebase-messaging-directboot:24.0.0'
    implementation 'com.google.firebase:firebase-iid:21.1.0'
    implementation 'com.google.firebase:firebase-firestore:25.0.0'

    // Kotlin Coroutines (async)
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.8.1"

    // Socket IO
    implementation ('io.socket:socket.io-client:2.1.1') {
        // excluding org.json which is provided by Android
        exclude group: 'org.json', module: 'json'
    }

    // JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'

    // HTTP Client (OkHttp + Retrofit)
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.3.2'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'

    // For AGP 7.4+ desugaring
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")

    implementation 'org.unifiedpush.android:connector:2.5.0'
}

// Flutter's AOT compiler output is produced before the Android native-library
// merge, but the AGP merge/strip tasks can incorrectly reuse an older prod
// release snapshot. That produced Build 92 with current manifest/version
// metadata and Build 91 Dart execution code. Force the Sean prod native stages
// to consume the compiler output from this invocation.
tasks.configureEach { task ->
    if (task.name in [
        'mergeProdReleaseJniLibFolders',
        'mergeProdReleaseNativeLibs',
        'stripProdReleaseDebugSymbols',
    ]) {
        task.outputs.upToDateWhen { false }
    }
}

def seanRequiredLogicalRouteSchema = 'LOGICAL_CONVERSATION_OUTBOUND_ROUTE_V2_GENERIC_PROVENANCE'
def seanForbiddenLogicalRouteSchema = 'LOGICAL_CONVERSATION_OUTBOUND_ROUTE_V1_GOLDEN_2155_2156'

def verifySeanLogicalRouteAot = { File apk ->
    if (!apk.isFile()) {
        throw new GradleException("SEAN_RELEASE_APK_MISSING: ${apk}")
    }

    def archive = new java.util.zip.ZipFile(apk)
    try {
        def aotEntries = java.util.Collections.list(archive.entries()).findAll { entry ->
            !entry.directory &&
                entry.name.startsWith('lib/') &&
                entry.name.endsWith('/libapp.so') &&
                entry.name.count('/') == 2
        }
        if (aotEntries.isEmpty()) {
            throw new GradleException('SEAN_RELEASE_AOT_PAYLOAD_MISSING')
        }

        aotEntries.each { entry ->
            byte[] payload = archive.getInputStream(entry).withCloseable { stream -> stream.bytes }
            String asciiPayload = new String(payload, java.nio.charset.StandardCharsets.ISO_8859_1)
            boolean hasRequired = asciiPayload.contains(seanRequiredLogicalRouteSchema)
            boolean hasForbidden = asciiPayload.contains(seanForbiddenLogicalRouteSchema)
            if (!hasRequired && hasForbidden) {
                throw new GradleException("SEAN_RELEASE_AOT_STALE_ROUTE_SCHEMA_V1: ${entry.name}")
            }
            if (!hasRequired) {
                throw new GradleException("SEAN_RELEASE_AOT_ROUTE_SCHEMA_MISSING: ${entry.name}")
            }
            if (hasForbidden) {
                throw new GradleException("SEAN_RELEASE_AOT_FORBIDDEN_ROUTE_SCHEMA_PRESENT: ${entry.name}")
            }
        }
    } finally {
        archive.close()
    }
}

def verifySeanProdReleaseAot = tasks.register('verifySeanProdReleaseAot') {
    group = 'verification'
    description = 'Rejects a Sean prod APK whose packaged Dart AOT route schema is stale.'
    doLast {
        verifySeanLogicalRouteAot(file("${buildDir}/outputs/apk/prod/release/app-prod-release.apk"))
        logger.lifecycle('SEAN_RELEASE_AOT_ROUTE_SCHEMA_PASS')
    }
}

tasks.matching { task -> task.name == 'assembleProdRelease' }.configureEach {
    finalizedBy(verifySeanProdReleaseAot)
}

tasks.register('verifySeanStaleAotRegression') {
    group = 'verification'
    description = 'Proves that the retained Build 92 stale AOT payload is rejected.'
    doLast {
        def regressionPath = providers.gradleProperty('seanStaleAotRegressionApk').orNull
        if (!regressionPath) {
            throw new GradleException('SEAN_STALE_AOT_REGRESSION_APK_PROPERTY_REQUIRED')
        }
        try {
            verifySeanLogicalRouteAot(file(regressionPath))
        } catch (GradleException error) {
            if (error.message?.startsWith('SEAN_RELEASE_AOT_STALE_ROUTE_SCHEMA_V1:')) {
                logger.lifecycle('BUILD_92_STALE_AOT_REGRESSION_PASS')
                return
            }
            throw error
        }
        throw new GradleException('BUILD_92_STALE_AOT_REGRESSION_NOT_REPRODUCED')
    }
}
