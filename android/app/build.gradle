def verifySeanRequiredMarkers = { String payload, Map<String, String> requirements, String scope ->
    requirements.each { failureCode, marker ->
        if (!payload.contains(marker)) {
            throw new GradleException("${failureCode}: ${scope}")
        }
    }
}

def verifySeanCandidateVersionCode = { int actualVersionCode ->
    if (actualVersionCode != seanRequiredCandidateVersionCode) {
        throw new GradleException(
            "SEAN_RELEASE_VERSION_CODE_MISMATCH: expected=${seanRequiredCandidateVersionCode}, actual=${actualVersionCode}"
        )
    }
}

def verifySeanLogicalRouteAot = { File apk ->
    if (!apk.isFile()) {
        throw new GradleException("SEAN_RELEASE_APK_MISSING: ${apk}")
    }

    def archive = new java.util.zip.ZipFile(apk)
    try {
        def aotEntries = java.util.Collections.list(archive.entries()).findAll { entry ->
            !entry.directory &&
                entry.name.startsWith('lib/') &&
                entry.name.endsWith('/libapp.so') &&
                entry.name.count('/') == 2
        }
        if (aotEntries.isEmpty()) {
            throw new GradleException('SEAN_RELEASE_AOT_PAYLOAD_MISSING')
        }

        aotEntries.each { entry ->
            byte[] payload = archive.getInputStream(entry).withCloseable { stream -> stream.bytes }
            String asciiPayload = new String(payload, java.nio.charset.StandardCharsets.ISO_8859_1)
            boolean hasRequiredRoute = asciiPayload.contains(seanRequiredLogicalRouteSchema)
            boolean hasForbiddenRoute = asciiPayload.contains(seanForbiddenLogicalRouteSchema)
            boolean hasRequiredReadCertificate = asciiPayload.contains(seanRequiredLogicalReadCertificateSchema)
            boolean hasRequiredExecutionGeneration = asciiPayload.contains(seanRequiredExecutionGenerationSchema)
            boolean hasRequiredEvidenceReconciliation = asciiPayload.contains(seanRequiredEvidenceReconciliationSchema)
            boolean hasRequiredRuntimeCertificate = asciiPayload.contains(seanRequiredRuntimeCertificateSchema)
            boolean hasRequiredLogicalDraft = asciiPayload.contains(seanRequiredLogicalDraftSchema)
            boolean hasRequiredLogicalAdmission = asciiPayload.contains(seanRequiredLogicalAdmissionSchema)
            boolean hasRequiredIncrementalProjection = asciiPayload.contains(seanRequiredIncrementalProjectionSchema)
            boolean hasForbiddenPairId = asciiPayload.contains(seanForbiddenLogicalPairId)
            boolean hasStaleProviderFactRoute = asciiPayload.contains(seanStaleProviderFactRouteSchema)
            boolean hasRequiredWriteAuthority = asciiPayload.contains(seanRequiredWriteAuthorityMarker)
            if (!hasRequiredRoute && hasForbiddenRoute) {
                throw new GradleException("SEAN_RELEASE_AOT_STALE_ROUTE_SCHEMA_V1: ${entry.name}")
            }
            if (!hasRequiredReadCertificate && hasForbiddenPairId) {
                throw new GradleException("SEAN_RELEASE_AOT_STALE_READ_CERTIFICATE_PAIR: ${entry.name}")
            }
            if (!hasRequiredRoute) {
                throw new GradleException("SEAN_RELEASE_AOT_ROUTE_SCHEMA_MISSING: ${entry.name}")
            }
            if (hasForbiddenRoute) {
                throw new GradleException("SEAN_RELEASE_AOT_FORBIDDEN_ROUTE_SCHEMA_PRESENT: ${entry.name}")
            }
            if (!hasRequiredReadCertificate) {
                throw new GradleException("SEAN_RELEASE_AOT_READ_CERTIFICATE_SCHEMA_MISSING: ${entry.name}")
            }
            if (!hasRequiredExecutionGeneration) {
                throw new GradleException("SEAN_RELEASE_AOT_EXECUTION_GENERATION_SCHEMA_MISSING: ${entry.name}")
            }
            if (!hasRequiredEvidenceReconciliation) {
                throw new GradleException("SEAN_RELEASE_AOT_EVIDENCE_RECONCILIATION_SCHEMA_MISSING: ${entry.name}")
            }
            if (!hasRequiredRuntimeCertificate) {
                throw new GradleException("SEAN_RELEASE_AOT_RUNTIME_CERTIFICATE_SCHEMA_MISSING: ${entry.name}")
            }
            if (!hasRequiredLogicalDraft) {
                throw new GradleException("SEAN_RELEASE_AOT_LOGICAL_DRAFT_SCHEMA_MISSING: ${entry.name}")
            }
            if (!hasRequiredLogicalAdmission) {
                throw new GradleException("SEAN_RELEASE_AOT_LOGICAL_ADMISSION_SCHEMA_MISSING: ${entry.name}")
            }
            if (!hasRequiredIncrementalProjection) {
                throw new GradleException("SEAN_RELEASE_AOT_INCREMENTAL_PROJECTION_SCHEMA_MISSING: ${entry.name}")
            }
            verifySeanRequiredMarkers(asciiPayload, seanRequiredDailyDriverAotMarkers, entry.name)
            if (hasForbiddenPairId) {
                throw new GradleException("SEAN_RELEASE_AOT_FORBIDDEN_PAIR_CERTIFICATE_PRESENT: ${entry.name}")
            }
            if (hasStaleProviderFactRoute) {
                throw new GradleException("SEAN_RELEASE_AOT_STALE_PROVIDER_FACT_ROUTE_SCHEMA_PRESENT: ${entry.name}")
            }
            if (!hasRequiredWriteAuthority) {
                throw new GradleException("SEAN_RELEASE_AOT_WRITE_AUTHORITY_CONVERGENCE_MISSING: ${entry.name}")
            }
        }
    } finally {
        archive.close()
    }
}

def verifySeanNativePolicyContracts = { File apk ->
    if (!apk.isFile()) {
        throw new GradleException("SEAN_RELEASE_APK_MISSING: ${apk}")
    }

    def archive = new java.util.zip.ZipFile(apk)
    try {
        def dexEntries = java.util.Collections.list(archive.entries()).findAll { entry ->
            !entry.directory && entry.name ==~ /classes(\d*)\.dex/
        }
        if (dexEntries.isEmpty()) {
            throw new GradleException('SEAN_RELEASE_NATIVE_DEX_PAYLOAD_MISSING')
        }
        String dexPayload = dexEntries.collect { entry ->
            byte[] payload = archive.getInputStream(entry).withCloseable { stream -> stream.bytes }
            new String(payload, java.nio.charset.StandardCharsets.ISO_8859_1)
        }.join('\u0000')
        verifySeanRequiredMarkers(dexPayload, seanRequiredNativePolicyMarkers, 'classes*.dex')
    } finally {
        archive.close()
    }
}

def verifySeanCandidateVersionMetadata = { File metadataFile ->
    if (!metadataFile.isFile()) {
        throw new GradleException("SEAN_RELEASE_OUTPUT_METADATA_MISSING: ${metadataFile}")
    }
    def metadata = new groovy.json.JsonSlurper().parse(metadataFile)
    def output = metadata.elements?.find { element -> element.outputFile == 'app-prod-release.apk' }
    if (output == null && metadata.elements?.size() == 1) {
        output = metadata.elements[0]
    }
    if (output == null || !(output.versionCode instanceof Number)) {
        throw new GradleException('SEAN_RELEASE_OUTPUT_VERSION_CODE_UNAVAILABLE')
    }
    int actualVersionCode = (output.versionCode as Number).intValue()
    verifySeanCandidateVersionCode(actualVersionCode)
}

